<!doctype html><meta charset="utf-8"><title>RAG 证据实验</title><link rel="stylesheet" href="rag.css"><main><p style="font-size:16px"><a href="index.html">← 返回 Demo 导览</a>　<a href="rounds.html">四轮实验</a>　<a href="scoring.html">评分公式</a>　<a href="rag.html">RAG 证据</a></p><h1>R4 + RAG：先找证据，再写引言</h1><small>知识库：4 条人工核验的中文摘要片段，附原文定位；不是完整论文向量库。检索采用关键词匹配 Top-3。</small><section id="retrieve"><h2>① 查询与检索</h2><input id="q" value="联邦学习 移动场景 本地训练 聚合机制 数据异质性 通信挑战"><button id="search">检索证据</button><div id="hits"></div><p id="status"></p></section><section id="assemble"><h2>② 将检索证据加入提示词</h2><button id="build">组装增强提示词</button><textarea id="prompt" readonly></textarea></section><section id="generate"><h2>③ 基于检索片段的生成记录</h2><button id="replay">查看本次 AI 生成记录</button><div id="result">先检索并组装提示词</div><small>生成方式：本次对话中的 AI 阅读已检索证据后撰写；此按钮回放记录，不会在线调用模型。可复制增强提示词到实际使用的 AI 工具复现。</small></section><p><small>检索相关 ≠ 事实必真；输出仍需逐句核查。无匹配时停止组装，不凭空补文献。</small></p></main><script src="core.js"></script><script src="rag.js"></script>
